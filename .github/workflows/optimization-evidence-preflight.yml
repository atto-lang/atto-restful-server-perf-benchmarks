name: optimization-evidence-preflight
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run bounded standalone preflight tests (not performance benchmarks)
        run: cd scripts && python3 -m unittest test_optimization_evidence.py
