name: Current Spin fresh vs pooled lifecycle smoke
on:
  push:
    branches: ['feat/spin-current-paired-lifecycle-20261127']
  pull_request:
    paths:
      - 'src/oreslang/spin/run-current.sh'
      - 'src/oreslang/spin/server_current.atto'
      - 'scripts/check-spin-worker-reuse.mjs'
      - 'scripts/spin-worker-proof.mjs'
      - 'scripts/test-spin-worker-proof.mjs'
      - 'scripts/test-spin-worker-http.mjs'
      - '.github/workflows/spin-current-lifecycle.yml'
      - 'scripts/http-speed*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact current Spin dependencies
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/atto-lang/atto-spin.git "$RUNNER_TEMP/spin"
          git -C "$RUNNER_TEMP/spin" checkout --detach 66662e7b8977283c357bcc7c21601547953baa49
          git clone --no-checkout https://github.com/atto-lang/atto-http-routing.git "$RUNNER_TEMP/spin/dependencies/http-routing"
          git -C "$RUNNER_TEMP/spin/dependencies/http-routing" checkout --detach 4c28fe37178f52ebe4bd504d608ff42215f1ec48
          git clone --no-checkout https://github.com/atto-lang/atto-source.java.git "$RUNNER_TEMP/compiler"
          git -C "$RUNNER_TEMP/compiler" checkout --detach e6098659c2e1641564bb5835b4dbb92a6a00b1a8
          (cd "$RUNNER_TEMP/compiler" && mvn -B -q -DskipTests clean package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt)
          python3 -m pip install --user jsonschema==4.25.1
          ORESLANG_SOURCE_DIR="$RUNNER_TEMP/compiler" bash "$RUNNER_TEMP/spin/scripts/check-pins.sh"
      - name: Host regressions
        run: |
          bash -n src/oreslang/spin/run-current.sh
          node --check scripts/check-spin-worker-reuse.mjs
          node --test scripts/test-http-speed-client.mjs scripts/test-http-speed-receipt.mjs scripts/test-spin-worker-proof.mjs scripts/test-spin-worker-http.mjs
      - name: Same-pin paired lifecycle smoke (not ranking evidence)
        run: |
          export ORESLANG_SPIN_DIR="$RUNNER_TEMP/spin"
          export ORESLANG_SOURCE_DIR="$RUNNER_TEMP/compiler"
          targets=(spin-current-jvm-shared-fresh spin-current-jvm-shared-pooled spin-current-jvm-isolated-fresh spin-current-jvm-isolated-pooled)
          node scripts/http-speed.mjs smoke results/spin-current-lifecycle "${targets[@]}"
          node scripts/http-speed-receipt.mjs results/spin-current-lifecycle "$(git rev-parse HEAD)" "$(sha256sum contracts/conformance/cases.json | cut -d' ' -f1)" "${targets[@]}"
      - name: Preserve receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spin-current-lifecycle
          path: results/spin-current-lifecycle/
          if-no-files-found: warn
