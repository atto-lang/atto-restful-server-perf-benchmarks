name: Same-host HTTP resource diagnostic
on:
  push:
    branches: ['feat/http-resource-sampling-20261127']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resource-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 scripts/test-resource-sample.py -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build current pinned compiler and reference server
        run: |
          set -euxo pipefail
          (cd src/java/vertx && mvn -B -q -DskipTests package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt)
          (cd src/java/vertx && mvn -B -q dependency:tree -DoutputFile=dependency-tree.lock)
          git diff --exit-code -- src/java/vertx/dependency-tree.lock
          git clone --no-checkout https://github.com/atto-lang/atto-spin.git "$RUNNER_TEMP/spin"
          git -C "$RUNNER_TEMP/spin" checkout --detach 66662e7b8977283c357bcc7c21601547953baa49
          git clone --no-checkout https://github.com/atto-lang/atto-http-routing.git "$RUNNER_TEMP/spin/dependencies/http-routing"
          git -C "$RUNNER_TEMP/spin/dependencies/http-routing" checkout --detach 4c28fe37178f52ebe4bd504d608ff42215f1ec48
          git clone --no-checkout https://github.com/atto-lang/atto-source.java.git "$RUNNER_TEMP/compiler"
          git -C "$RUNNER_TEMP/compiler" checkout --detach e6098659c2e1641564bb5835b4dbb92a6a00b1a8
          (cd "$RUNNER_TEMP/compiler" && mvn -B -q -DskipTests clean package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt)
          python3 -m pip install --user jsonschema==4.25.1
      - name: Profile same JDK Vert.x and current pooled Spin
        run: |
          export ORESLANG_SPIN_DIR="$RUNNER_TEMP/spin"
          export ORESLANG_SOURCE_DIR="$RUNNER_TEMP/compiler"
          export ATTO_BENCH_RESOURCE_SAMPLE=1
          targets=(java-vertx spin-current-jvm-shared-pooled spin-current-jvm-isolated-pooled)
          node scripts/http-speed.mjs smoke results/resource-probe "${targets[@]}"
          node scripts/http-speed-receipt.mjs results/resource-probe "$(git rev-parse HEAD)" "$(sha256sum contracts/conformance/cases.json | cut -d' ' -f1)" "${targets[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resource-probe
          path: results/resource-probe/
          if-no-files-found: warn
